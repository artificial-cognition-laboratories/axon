[package]
name = "axon-net"
description = "The machine network's transport: dials machines by public key over iroh and pipes bytes between the daemon and its peers. Knows keys, connections and bytes — never verbs, owners or policy."
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[[bin]]
name = "axon-net"
path = "src/main.rs"

[dependencies]
iroh = "1.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
